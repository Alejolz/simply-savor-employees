<div class="login-container relative">
  <!-- Efecto de burbujas -->
  <div class="bubbles">
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
  </div>

  <div class="card login-card relative z-10">
    <div class="card-body">
      <div class="text-center mb-4">
        <div class="d-flex justify-content-center">
          <img src="assets/company-logo.jpg" alt="Logo" class="logo">
        </div>
        <h2 class="card-title fw-bold">Portal de Empleados</h2>
        <p class="text-muted">Ingresa a tu cuenta para continuar</p>
      </div>

      <!-- Formulario sin ngModel -->
      <form (submit)="onSubmit($event)" novalidate>
        <div class="form-floating mb-3">
          <input 
            type="email" 
            class="form-control" 
            id="email" 
            placeholder="nombre@ejemplo.com"
            name="email"
            required>
          <label for="email">Correo electrónico</label>
        </div>

        <div class="form-floating mb-4">
          <input 
            type="password" 
            class="form-control" 
            id="password" 
            placeholder="Contraseña"
            name="password"
            required
            minlength="6">
          <label for="password">Contraseña</label>
        </div>

        <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

        <div class="d-flex justify-content-between mb-4">
          <a 
            href="#" 
            class="text-blue-600 hover:text-blue-800 text-decoration-none"
            (click)="toggleForgotMessage($event)"
          >
            ¿Olvidaste tu contraseña?
          </a>
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-primary btn-lg" [disabled]="isLoading">
            {{ isLoading ? 'Cargando...' : 'Iniciar Sesión' }}
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- 🔹 Mensaje superpuesto -->
  <div
    *ngIf="showForgotMessage"
    class="absolute inset-0 flex items-center justify-center bg-black/40 backdrop-blur-sm z-20 transition-all"
  >
    <div class="bg-white rounded-2xl shadow-2xl p-6 max-w-sm text-center relative">
      <button
        (click)="toggleForgotMessage($event)"
        class="absolute top-3 right-3 text-gray-400 hover:text-gray-600"
      >
        <i class="bi bi-x-lg text-sm"></i>
      </button>

      <h3 class="text-xl font-semibold text-gray-800 mb-3">¿Olvidaste tu contraseña?</h3>
      <p class="text-gray-600 mb-5">
        Si olvidaste tu contraseña, por favor contacta con el equipo de soporte
        para restablecer el acceso a tu cuenta.
      </p>
      <!-- <a 
        href="mailto:soporte@tuempresa.com"
        class="inline-block bg-blue-600 text-white px-5 py-2 rounded-lg hover:bg-blue-700 transition"
      >
        Contactar soporte
      </a> -->
    </div>
  </div>
</div>
